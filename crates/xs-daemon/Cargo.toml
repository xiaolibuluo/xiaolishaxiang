[package]
name = "xs-daemon"
version = { workspace = true }
description = "xiaolishaxiang daemon: gRPC API + sandbox pool + lifecycle"
license.workspace = true
edition.workspace = true
rust-version = "1.85"

[dependencies]
xs-core = { path = "../xs-core" }
xs-api = { path = "../xs-api" }
xs-policy = { path = "../xs-policy" }
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
sha2 = "0.10"
toml = { workspace = true }
axum = "0.8"
hyper = "1"
prometheus = { version = "0.13", features = ["process"] }

[dev-dependencies]
serial_test = "3"

[build-dependencies]
tonic-build = "0.13"
